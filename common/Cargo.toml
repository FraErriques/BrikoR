[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }